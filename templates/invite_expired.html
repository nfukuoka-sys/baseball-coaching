<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>リンク無効 — DIMENSIONING</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0b1930; font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
           color: rgba(255,255,255,.7); text-align: center; padding: 20px; }
    .icon { font-size: 3rem; margin-bottom: 16px; opacity: .4; }
    h2 { color: #fff; font-size: 1rem; letter-spacing: .1em; margin-bottom: 8px; }
    p { font-size: .82rem; line-height: 1.6; color: rgba(255,255,255,.4); }
  </style>
</head>
<body>
  <div>
    <div class="icon">🔒</div>
    <h2>この招待リンクは無効です</h2>
    <p>リンクの有効期限が切れているか、すでに使用済みです。<br>コーチに新しい招待リンクを発行してもらってください。</p>
  </div>
</body>
</html>
