{% extends 'base.html' %}
{% block title %}一括割り当て — {{ drill.title }}{% endblock %}
{% block content %}

<div style="margin-bottom:14px;">
  <a href="{{ url_for('coach_drills') }}" style="font-size:.78rem;color:var(--dm-blue);text-decoration:none;">
    <i class="bi bi-arrow-left"></i> ドリル一覧に戻る
  </a>
</div>

<div class="dm-card" style="margin-bottom:16px;">
  <div class="dm-card-header">
    <span class="dm-card-title"><i class="bi bi-people me-1" style="color:#2563eb;"></i>一括割り当て</span>
  </div>
  <div style="padding:16px;">
    <!-- ドリル情報 -->
    <div style="background:var(--dm-navy);border-radius:10px;padding:14px;margin-bottom:18px;color:#fff;">
      <div style="font-size:.65rem;letter-spacing:.12em;color:rgba(255,255,255,.4);margin-bottom:4px;">DRILL</div>
      <div style="font-weight:800;font-size:1rem;">{{ drill.title }}</div>
      <div style="font-size:.72rem;color:rgba(255,255,255,.5);margin-top:4px;">{{ drill.category }}</div>
    </div>

    <form method="POST">
      <!-- 選手選択 -->
      <div style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <label style="font-size:.78rem;font-weight:700;color:var(--dm-text);">割り当てる選手を選択</label>
          <div style="display:flex;gap:8px;">
            <button type="button" onclick="selectAll(true)"
                    style="font-size:.72rem;color:var(--dm-blue);background:none;border:1px solid var(--dm-blue);
                           border-radius:6px;padding:3px 10px;cursor:pointer;">全選択</button>
            <button type="button" onclick="selectAll(false)"
                    style="font-size:.72rem;color:var(--dm-muted);background:none;border:1px solid var(--dm-border);
                           border-radius:6px;padding:3px 10px;cursor:pointer;">解除</button>
          </div>
        </div>

        <div style="border:1px solid var(--dm-border);border-radius:10px;overflow:hidden;max-height:400px;overflow-y:auto;">
          {% for p in players %}
          <label style="display:flex;align-items:center;gap:12px;padding:12px 16px;
                        border-bottom:1px solid var(--dm-border);cursor:pointer;transition:.15s;"
                 onmouseover="this.style.background='var(--dm-light)'" onmouseout="this.style.background=''">
            <input type="checkbox" name="player_ids" value="{{ p.id }}" class="player-cb"
                   {% if p.id in already %}checked disabled{% endif %}
                   style="width:16px;height:16px;accent-color:var(--dm-blue);flex-shrink:0;">
            <div style="flex:1;">
              <div style="font-weight:700;font-size:.88rem;">{{ p.name }}</div>
              <div style="font-size:.7rem;color:var(--dm-muted);">{{ p.position or '—' }} / {{ p.team or '—' }}</div>
            </div>
            {% if p.id in already %}
            <span style="font-size:.68rem;background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:10px;font-weight:700;">割当済</span>
            {% endif %}
          </label>
          {% endfor %}
          {% if not players %}
          <div style="text-align:center;padding:32px;color:var(--dm-muted);font-size:.82rem;">
            アクティブな選手がいません
          </div>
          {% endif %}
        </div>
        <div style="margin-top:6px;font-size:.7rem;color:var(--dm-muted);">
          「割当済」の選手は重複して追加されません
        </div>
      </div>

      <!-- コーチメモ -->
      <div style="margin-bottom:16px;">
        <label style="font-size:.72rem;color:var(--dm-muted);display:block;margin-bottom:4px;">コーチメモ（全員共通・任意）</label>
        <textarea name="coach_note" rows="2" placeholder="例：動画を参考にフォームを確認してください"
                  style="width:100%;padding:10px 12px;border:1.5px solid var(--dm-border);border-radius:8px;
                         font-size:.86rem;background:var(--dm-bg);color:var(--dm-text);resize:vertical;outline:none;"></textarea>
      </div>

      <button type="submit"
              style="background:var(--dm-blue);color:#fff;border:none;border-radius:8px;
                     padding:12px 20px;font-size:.86rem;font-weight:700;letter-spacing:.08em;cursor:pointer;width:100%;">
        <i class="bi bi-send me-1"></i>選択した選手に割り当てる
      </button>
    </form>
  </div>
</div>

<script>
function selectAll(v) {
  document.querySelectorAll('.player-cb:not(:disabled)').forEach(cb => cb.checked = v);
}
</script>

{% endblock %}
