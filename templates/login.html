<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>b.n BASEBALL APP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #040a14;
      font-family: 'Noto Sans JP', 'Helvetica Neue', Arial, sans-serif;
    }

    /* ── 背景レイヤー ── */
    .bg {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .bg-half {
      position: relative;
      overflow: hidden;
    }

    .bg-half img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    /* 中央のソフトな境界 */
    .bg-coach::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right,
        rgba(4,10,20,0) 50%,
        rgba(4,10,20,.6) 80%,
        rgba(4,10,20,.85) 100%);
    }
    .bg-player::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to left,
        rgba(4,10,20,0) 50%,
        rgba(4,10,20,.6) 80%,
        rgba(4,10,20,.85) 100%);
    }

    /* 上部グラデーション（ロゴ視認性） */
    .bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
        rgba(4,10,20,.72) 0%,
        rgba(4,10,20,.3) 28%,
        rgba(4,10,20,0) 50%,
        rgba(4,10,20,.15) 65%,
        rgba(4,10,20,.7) 85%,
        rgba(4,10,20,.9) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* 中央の区切り線 */
    .bg-divider {
      position: absolute;
      left: 50%;
      top: 0; bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom,
        transparent 0%,
        rgba(255,255,255,.08) 20%,
        rgba(255,255,255,.18) 50%,
        rgba(255,255,255,.08) 80%,
        transparent 100%);
      transform: translateX(-50%);
      z-index: 2;
      pointer-events: none;
    }

    /* ── コンテンツ層 ── */
    .page {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      padding-top: max(env(safe-area-inset-top, 0px), 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ── ロゴゾーン（上半分） ── */
    .logo-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      gap: 0;
    }

    /* b.n ロゴ */
    .logo-mark {
      display: flex;
      align-items: baseline;
      gap: 2px;
      margin-bottom: 10px;
      line-height: 1;
    }

    .logo-b, .logo-n {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-style: italic;
      font-weight: 700;
      font-size: clamp(64px, 20vw, 100px);
      color: transparent;
      background: linear-gradient(180deg,
        #ffffff 0%,
        #e0e0e0 40%,
        #b8b8b8 70%,
        #888 100%);
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 2px 12px rgba(0,0,0,.7));
      line-height: .95;
    }

    .logo-dot {
      font-family: 'Georgia', serif;
      font-size: clamp(20px, 6vw, 30px);
      color: rgba(255,255,255,.8);
      margin: 0 1px;
      padding-bottom: 8px;
      align-self: flex-end;
    }

    .logo-slash {
      font-family: 'Georgia', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(52px, 16vw, 82px);
      color: rgba(255,255,255,.45);
      line-height: .95;
      margin: 0 -2px;
    }

    .logo-app {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: clamp(11px, 3.5vw, 16px);
      letter-spacing: .44em;
      color: #fff;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-shadow: 0 1px 8px rgba(0,0,0,.8);
    }

    .logo-tagline {
      font-family: 'Oswald', sans-serif;
      font-weight: 300;
      font-size: clamp(8px, 2.4vw, 11px);
      letter-spacing: .28em;
      color: rgba(255,255,255,.35);
      text-align: center;
    }

    /* ── 中央スペーサー（背景を見せる） ── */
    .spacer {
      flex: 1.2;
    }

    /* ── ボタンゾーン（下部） ── */
    .btn-zone {
      width: 100%;
      max-width: 480px;
      padding: 0 16px 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex-shrink: 0;
    }

    /* グラスカード */
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 10px 16px;
      border-radius: 14px;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: transform .18s ease;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      /* ガラス効果 */
      background: rgba(8,16,34,.55);
      backdrop-filter: blur(14px) saturate(1.5);
      -webkit-backdrop-filter: blur(14px) saturate(1.5);
      border: 1px solid rgba(255,255,255,.13);
    }

    .card:active { transform: scale(.97); }

    /* コーチカード：微細な白ボーダー */
    .card-coach {
      border-color: rgba(255,255,255,.13);
    }

    /* 選手カード：青い発光ボーダー */
    .card-player {
      border-color: rgba(80,150,255,.32);
      box-shadow:
        0 0 0 1px rgba(60,120,255,.1),
        0 0 20px rgba(37,99,235,.2),
        inset 0 0 20px rgba(37,99,235,.05);
    }

    @media (hover: hover) {
      .card-coach:hover {
        background: rgba(255,255,255,.1);
        border-color: rgba(255,255,255,.22);
        transform: translateY(-2px);
      }
      .card-player:hover {
        background: rgba(20,55,140,.5);
        border-color: rgba(80,150,255,.5);
        transform: translateY(-2px);
        box-shadow: 0 0 28px rgba(37,99,235,.35), inset 0 0 24px rgba(37,99,235,.08);
      }
    }

    /* アイコン */
    .card-icon {
      width: 44px;
      height: 44px;
      margin-bottom: 10px;
      opacity: .82;
      flex-shrink: 0;
    }

    /* タイトル */
    .card-title-ja {
      font-size: clamp(20px, 5.5vw, 26px);
      font-weight: 700;
      color: #fff;
      letter-spacing: .05em;
      margin-bottom: 2px;
      text-shadow: 0 1px 6px rgba(0,0,0,.6);
    }

    .card-title-en {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(8px, 2.2vw, 10px);
      letter-spacing: .22em;
      color: rgba(255,255,255,.35);
      margin-bottom: 10px;
    }

    .card-desc {
      font-size: clamp(9px, 2.4vw, 11px);
      color: rgba(255,255,255,.45);
      line-height: 1.6;
      text-align: center;
      flex: 1;
    }

    /* 矢印 */
    .card-arrow {
      margin-top: 12px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .82rem;
    }
    .card-coach .card-arrow {
      border: 1px solid rgba(255,255,255,.22);
      color: rgba(255,255,255,.5);
    }
    .card-player .card-arrow {
      border: 1px solid rgba(80,150,255,.55);
      color: rgba(120,180,255,.8);
    }
  </style>
</head>
<body>

<!-- 背景 -->
<div class="bg">
  <div class="bg-half bg-coach">
    <img src="{{ url_for('static', filename='images/bg-coach.jpg') }}" alt="">
  </div>
  <div class="bg-half bg-player">
    <img src="{{ url_for('static', filename='images/bg-player.jpg') }}" alt="">
  </div>
  <div class="bg-divider"></div>
</div>

<!-- コンテンツ -->
<div class="page">

  <!-- ロゴ -->
  <div class="logo-zone">
    <div class="logo-mark">
      <span class="logo-b">b</span>
      <span class="logo-dot">.</span>
      <span class="logo-slash">/</span>
      <span class="logo-n">n</span>
    </div>
    <div class="logo-app">Baseball App</div>
    <div class="logo-tagline">BETTER PLAY.&nbsp;&nbsp;&nbsp;NEXT STAGE.</div>
  </div>

  <!-- 中央スペース（写真を見せる） -->
  <div class="spacer"></div>

  <!-- ロール選択 -->
  <div class="btn-zone">

    <a href="/login/coach" class="card card-coach">
      <!-- コーチアイコン -->
      <svg class="card-icon" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="22" cy="11" r="7" fill="white" opacity=".85"/>
        <path d="M8 38 C8 28 36 28 36 38" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".85"/>
        <path d="M14 23 L8 28 L4 26" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
        <rect x="1" y="24" width="8" height="6" rx="1.5" fill="white" opacity=".65"/>
      </svg>
      <div class="card-title-ja">コーチ</div>
      <div class="card-title-en">COACH</div>
      <div class="card-desc">選手の成長をサポート</div>
      <div class="card-arrow">→</div>
    </a>

    <a href="/login/player" class="card card-player">
      <!-- 選手アイコン -->
      <svg class="card-icon" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="18" cy="10" r="7" fill="white" opacity=".85"/>
        <path d="M4 38 C4 28 32 28 32 38" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".85"/>
        <!-- バット -->
        <line x1="28" y1="16" x2="42" y2="4" stroke="white" stroke-width="2.8" stroke-linecap="round" opacity=".8"/>
        <!-- 手 -->
        <circle cx="27" cy="17" r="2.5" fill="white" opacity=".75"/>
      </svg>
      <div class="card-title-ja">選手</div>
      <div class="card-title-en">PLAYER</div>
      <div class="card-desc">自分のデータを知り<br>さらに上へ</div>
      <div class="card-arrow">→</div>
    </a>

  </div>

</div>

</body>
</html>
