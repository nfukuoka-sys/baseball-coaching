<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOGIN — DIMENSIONING</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b1930;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
    }
    .wrap { width: 100%; max-width: 400px; padding: 20px; }
    .brand { text-align: center; margin-bottom: 48px; }
    .brand-icon {
      width: 56px; height: 56px; background: #1a4a90; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;
    }
    .brand-icon svg { width: 32px; height: 32px; fill: #fff; }
    .brand-name { color: #fff; font-size: 1rem; font-weight: 700; letter-spacing: .3em; }
    .brand-sub { color: rgba(255,255,255,.35); font-size: .65rem; letter-spacing: .2em; margin-top: 4px; }
    .label { color: rgba(255,255,255,.4); font-size: .68rem; letter-spacing: .15em; text-align: center; margin-bottom: 20px; }
    .btn-role {
      display: flex; align-items: center; gap: 16px;
      width: 100%; padding: 20px 24px; margin-bottom: 12px;
      background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.12);
      border-radius: 14px; color: #fff; text-decoration: none;
      transition: .2s; cursor: pointer;
    }
    .btn-role:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); }
    .btn-role-icon {
      width: 44px; height: 44px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      font-size: 1.3rem;
    }
    .coach-icon { background: #1a4a90; }
    .player-icon { background: #065f46; }
    .btn-role-text { flex: 1; }
    .btn-role-title { font-size: .88rem; font-weight: 700; letter-spacing: .08em; }
    .btn-role-sub { font-size: .68rem; color: rgba(255,255,255,.4); margin-top: 3px; }
    .footer { text-align: center; margin-top: 32px; color: rgba(255,255,255,.2); font-size: .65rem; letter-spacing: .1em; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
    </div>
    <div class="brand-name">DIMENSIONING</div>
    <div class="brand-sub">ATHLETE PLATFORM</div>
  </div>

  <div class="label">ログイン種別を選択してください</div>

  <a href="/login/coach" class="btn-role">
    <div class="btn-role-icon coach-icon"><i class="bi bi-person-badge"></i></div>
    <div class="btn-role-text">
      <div class="btn-role-title">コーチ</div>
      <div class="btn-role-sub">選手管理・データ入力</div>
    </div>
    <i class="bi bi-chevron-right" style="color:rgba(255,255,255,.3);"></i>
  </a>

  <a href="/login/player" class="btn-role">
    <div class="btn-role-icon player-icon"><i class="bi bi-person-fill"></i></div>
    <div class="btn-role-text">
      <div class="btn-role-title">選手</div>
      <div class="btn-role-sub">自分のデータ・練習メニューを確認</div>
    </div>
    <i class="bi bi-chevron-right" style="color:rgba(255,255,255,.3);"></i>
  </a>

  <div class="footer">© DIMENSIONING</div>
</div>
</body>
</html>
