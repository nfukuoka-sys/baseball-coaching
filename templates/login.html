<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>b.n BASEBALL APP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; overflow: hidden;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
    }

    /* ── 背景：左コーチ / 右選手 ── */
    .bg {
      position: fixed; inset: 0;
      display: flex;
    }
    .bg-half {
      flex: 1;
      position: relative;
    }
    .bg-coach {
      background:
        linear-gradient(to bottom, rgba(20,12,6,.45) 0%, rgba(40,20,5,.55) 100%),
        radial-gradient(ellipse at 60% 40%, rgba(180,100,30,.25) 0%, transparent 60%),
        linear-gradient(135deg, #1a0e05 0%, #2a1a08 30%, #0f1825 70%, #0a1422 100%);
    }
    .bg-player {
      background:
        linear-gradient(to bottom, rgba(5,15,35,.4) 0%, rgba(5,20,50,.5) 100%),
        radial-gradient(ellipse at 40% 35%, rgba(30,80,200,.3) 0%, transparent 55%),
        radial-gradient(ellipse at 70% 20%, rgba(255,255,255,.08) 0%, transparent 40%),
        linear-gradient(135deg, #0a1422 0%, #0d1f3c 40%, #0a1830 100%);
    }

    /* 中央分割ライン */
    .bg::after {
      content: '';
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 1.5px;
      background: linear-gradient(to bottom,
        transparent 0%,
        rgba(255,255,255,.06) 20%,
        rgba(255,255,255,.15) 50%,
        rgba(255,255,255,.06) 80%,
        transparent 100%);
      transform: translateX(-50%);
      pointer-events: none;
    }

    /* ── シルエット ── */
    .silhouette {
      position: absolute;
      bottom: 200px;
      opacity: .18;
    }
    .sil-coach {
      right: 10%;
      width: 140px; height: 200px;
    }
    .sil-player {
      left: 10%;
      width: 110px; height: 210px;
    }

    /* ── スタジアム光彩 ── */
    .light-flare {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .flare-1 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(255,160,30,.12) 0%, transparent 70%);
      top: -60px; right: -60px;
    }
    .flare-2 {
      width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(50,120,255,.18) 0%, transparent 70%);
      top: -40px; left: -40px;
    }

    /* ── メインコンテンツ ── */
    .content {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: 52px 20px 48px;
      pointer-events: none;
    }

    /* ── ロゴ ── */
    .logo-area {
      text-align: center;
      pointer-events: none;
    }
    .logo-mark {
      display: flex; align-items: center; justify-content: center;
      gap: 2px; margin-bottom: 10px;
    }
    .logo-b, .logo-n {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 4.2rem;
      color: #fff;
      line-height: 1;
      letter-spacing: -.02em;
      text-shadow: 0 2px 20px rgba(0,0,0,.6);
    }
    .logo-slash {
      font-family: 'Oswald', sans-serif;
      font-weight: 300;
      font-size: 4.2rem;
      color: rgba(255,255,255,.55);
      line-height: 1;
      transform: scaleX(.6);
      display: inline-block;
    }
    .logo-app {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 1.05rem;
      color: #fff;
      letter-spacing: .35em;
      margin-bottom: 5px;
    }
    .logo-tagline {
      font-size: .6rem;
      letter-spacing: .28em;
      color: rgba(255,255,255,.38);
    }

    /* ── キャッチコピー ── */
    .catchcopy {
      font-size: 1.45rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: .06em;
      text-align: center;
      text-shadow: 0 2px 16px rgba(0,0,0,.7);
      margin-top: 12px;
    }

    /* ── 役割選択ボタン ── */
    .role-buttons {
      width: 100%; max-width: 420px;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px;
      pointer-events: auto;
    }

    .btn-role {
      display: flex; flex-direction: column;
      align-items: center;
      padding: 20px 14px 20px;
      border-radius: 14px;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: transform .2s, box-shadow .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-role:active { transform: scale(.97); }

    .btn-coach {
      background: rgba(255,255,255,.08);
      border: 1.5px solid rgba(255,255,255,.18);
    }
    .btn-player {
      background: rgba(30,80,200,.15);
      border: 1.5px solid rgba(100,160,255,.35);
      box-shadow: 0 0 20px rgba(37,99,235,.25), inset 0 0 20px rgba(37,99,235,.08);
    }

    .btn-role-silhouette {
      width: 56px; height: 56px;
      margin-bottom: 12px;
      opacity: .75;
    }

    .btn-role-title {
      font-size: 1.45rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: .04em;
      margin-bottom: 8px;
      text-shadow: 0 1px 8px rgba(0,0,0,.5);
    }

    .btn-role-desc {
      font-size: .68rem;
      color: rgba(255,255,255,.5);
      line-height: 1.6;
      text-align: center;
      margin-bottom: 16px;
    }

    .btn-role-arrow {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .9rem;
    }
    .btn-coach .btn-role-arrow {
      border: 1.5px solid rgba(255,255,255,.25);
      color: rgba(255,255,255,.6);
    }
    .btn-player .btn-role-arrow {
      border: 1.5px solid rgba(100,160,255,.6);
      color: rgba(100,160,255,.9);
    }

    /* hover glow (desktop) */
    @media(hover:hover) {
      .btn-coach:hover {
        background: rgba(255,255,255,.13);
        border-color: rgba(255,255,255,.3);
        transform: translateY(-2px);
      }
      .btn-player:hover {
        background: rgba(30,80,200,.25);
        border-color: rgba(100,160,255,.55);
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(37,99,235,.4), inset 0 0 20px rgba(37,99,235,.12);
      }
    }
  </style>
</head>
<body>

<!-- 背景 -->
<div class="bg">
  <div class="bg-half bg-coach">
    <div class="light-flare flare-1"></div>
    <!-- コーチシルエット -->
    <svg class="silhouette sil-coach" viewBox="0 0 140 200" fill="white" xmlns="http://www.w3.org/2000/svg">
      <!-- 頭 -->
      <ellipse cx="75" cy="28" rx="18" ry="20"/>
      <!-- キャップ -->
      <rect x="57" y="10" width="36" height="10" rx="5"/>
      <rect x="50" y="14" width="50" height="6" rx="3"/>
      <!-- 胴体 -->
      <path d="M55 48 Q45 52 40 65 L38 100 Q38 108 46 108 L104 108 Q112 108 112 100 L110 65 Q105 52 95 48 Z"/>
      <!-- 腕（タブレット持つポーズ） -->
      <path d="M55 55 Q35 60 28 75 L30 82 Q38 72 58 68 Z"/>
      <!-- タブレット -->
      <rect x="18" y="68" width="28" height="22" rx="3"/>
      <!-- 右腕 -->
      <path d="M95 55 Q115 60 118 80 L110 82 Q106 70 92 68 Z"/>
      <!-- 脚 -->
      <rect x="58" y="108" width="18" height="55" rx="6"/>
      <rect x="64" y="155" width="16" height="18" rx="5"/>
      <rect x="79" y="108" width="18" height="55" rx="6"/>
      <rect x="80" y="155" width="16" height="18" rx="5"/>
    </svg>
  </div>
  <div class="bg-half bg-player">
    <div class="light-flare flare-2"></div>
    <!-- 選手シルエット -->
    <svg class="silhouette sil-player" viewBox="0 0 110 210" fill="white" xmlns="http://www.w3.org/2000/svg">
      <!-- ヘルメット -->
      <ellipse cx="55" cy="28" rx="20" ry="22"/>
      <rect x="35" y="38" width="40" height="10" rx="5"/>
      <path d="M33 30 Q28 34 30 44 L36 44 L36 30 Z"/>
      <!-- 胴体 -->
      <path d="M38 50 Q28 55 25 70 L22 100 Q22 110 32 110 L78 110 Q88 110 88 100 L85 70 Q82 55 72 50 Z"/>
      <!-- バット振りポーズ（両腕伸ばし） -->
      <path d="M68 55 Q85 45 95 35 L98 40 Q88 52 72 62 Z"/>
      <!-- バット -->
      <rect x="90" y="25" width="8" height="50" rx="4" transform="rotate(-30 90 25)"/>
      <!-- 左腕 -->
      <path d="M38 58 Q22 52 14 42 L18 38 Q28 50 44 58 Z"/>
      <!-- 脚 -->
      <rect x="35" y="110" width="18" height="58" rx="6"/>
      <rect x="34" y="158" width="18" height="18" rx="5"/>
      <rect x="56" y="110" width="18" height="58" rx="6"/>
      <rect x="58" y="158" width="18" height="18" rx="5"/>
    </svg>
  </div>
</div>

<!-- コンテンツ -->
<div class="content">

  <!-- ロゴ -->
  <div class="logo-area">
    <div class="logo-mark">
      <span class="logo-b">b</span>
      <span class="logo-slash">/</span>
      <span class="logo-n">n</span>
    </div>
    <div class="logo-app">BASEBALL APP</div>
    <div class="logo-tagline">BETTER PLAY.&nbsp;&nbsp;&nbsp;NEXT STAGE.</div>
    <div class="catchcopy">野球を、もっと本気に。</div>
  </div>

  <!-- 役割選択 -->
  <div class="role-buttons">
    <a href="/login/coach" class="btn-role btn-coach">
      <!-- コーチアイコン -->
      <svg class="btn-role-silhouette" viewBox="0 0 56 56" fill="white" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="30" cy="11" rx="7" ry="8"/>
        <path d="M20 20 Q14 22 12 30 L11 44 Q11 48 16 48 L44 48 Q49 48 49 44 L48 30 Q46 22 40 20 Z"/>
        <path d="M20 22 Q10 24 8 34 L10 36 Q14 28 22 27 Z"/>
        <rect x="4" y="30" width="12" height="9" rx="2"/>
        <path d="M40 22 Q50 24 52 34 L50 36 Q46 28 38 27 Z"/>
        <path d="M22 12 Q16 8 10 14 L14 18 Q18 14 24 16 Z" opacity=".6"/>
      </svg>
      <div class="btn-role-title">コーチ</div>
      <div class="btn-role-desc">選手の成長をサポートし<br>チームを強くするために</div>
      <div class="btn-role-arrow">→</div>
    </a>

    <a href="/login/player" class="btn-role btn-player">
      <!-- 選手アイコン -->
      <svg class="btn-role-silhouette" viewBox="0 0 56 56" fill="white" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="26" cy="11" rx="8" ry="9"/>
        <ellipse cx="24" cy="6" rx="10" ry="5"/>
        <path d="M16 20 Q8 23 6 33 L5 46 Q5 50 10 50 L42 50 Q47 50 47 46 L46 33 Q44 23 36 20 Z"/>
        <path d="M34 22 Q44 17 50 10 L52 14 Q46 23 36 28 Z"/>
        <rect x="46" y="6" width="5" height="28" rx="2.5" transform="rotate(-25 46 6)"/>
        <path d="M16 24 Q8 20 4 12 L6 10 Q12 20 20 24 Z"/>
      </svg>
      <div class="btn-role-title">選手</div>
      <div class="btn-role-desc">自分のデータを知り<br>さらなるレベルへ</div>
      <div class="btn-role-arrow">→</div>
    </a>
  </div>

</div>

</body>
</html>
