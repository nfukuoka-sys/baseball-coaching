<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>選手 LOGIN — DIMENSIONING</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b1930;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
    }
    .wrap { width: 100%; max-width: 400px; padding: 20px; }
    .brand { text-align: center; margin-bottom: 40px; }
    .brand-icon {
      width: 56px; height: 56px; background: #065f46; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;
    }
    .brand-icon svg { width: 32px; height: 32px; fill: #fff; }
    .brand-name { color: #fff; font-size: 1rem; font-weight: 700; letter-spacing: .3em; }
    .brand-sub { color: rgba(255,255,255,.35); font-size: .65rem; letter-spacing: .2em; margin-top: 4px; }
    .card {
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px; padding: 32px 28px;
    }
    .card-title {
      color: #fff; font-size: .88rem; letter-spacing: .15em; margin-bottom: 6px; font-weight: 600;
    }
    .card-sub { color: rgba(255,255,255,.35); font-size: .7rem; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { color: rgba(255,255,255,.5); font-size: .72rem; letter-spacing: .1em; display: block; margin-bottom: 6px; }
    input {
      width: 100%; background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.15);
      border-radius: 8px; padding: 12px 14px; color: #fff; font-size: .88rem;
      outline: none; transition: .2s;
    }
    input:focus { border-color: #10b981; background: rgba(255,255,255,.12); }
    input::placeholder { color: rgba(255,255,255,.25); }
    .btn-login {
      width: 100%; margin-top: 8px; padding: 13px;
      background: #065f46; border: none; border-radius: 8px;
      color: #fff; font-size: .82rem; font-weight: 700; letter-spacing: .15em;
      cursor: pointer; transition: .2s;
    }
    .btn-login:hover { background: #059669; }
    .alert-err {
      background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3);
      border-radius: 8px; padding: 10px 14px; color: #fca5a5; font-size: .78rem; margin-bottom: 16px;
    }
    .alert-info {
      background: rgba(37,99,235,.12); border: 1px solid rgba(37,99,235,.25);
      border-radius: 8px; padding: 10px 14px; color: #93c5fd; font-size: .75rem; margin-bottom: 16px;
    }
    .back { text-align: center; margin-top: 20px; }
    .back a { color: rgba(255,255,255,.3); font-size: .72rem; text-decoration: none; }
    .back a:hover { color: rgba(255,255,255,.6); }
    .footer { text-align: center; margin-top: 24px; color: rgba(255,255,255,.2); font-size: .65rem; letter-spacing: .1em; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
    </div>
    <div class="brand-name">DIMENSIONING</div>
    <div class="brand-sub">ATHLETE PLATFORM</div>
  </div>

  <div class="card">
    <div class="card-title"><i class="bi bi-person-fill me-2"></i>PLAYER LOGIN</div>
    <div class="card-sub">選手専用ログイン</div>

    <div class="alert-info"><i class="bi bi-info-circle me-1"></i>招待リンクからアカウントを作成済みの選手がログインできます</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert-err"><i class="bi bi-exclamation-triangle me-1"></i>{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label>EMAIL ADDRESS</label>
        <input type="email" name="email" placeholder="your@email.com" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">LOGIN</button>
    </form>
  </div>

  <div class="back"><a href="/login"><i class="bi bi-arrow-left me-1"></i>ログイン種別の選択に戻る</a></div>
  <div class="footer">© DIMENSIONING</div>
</div>
</body>
</html>
