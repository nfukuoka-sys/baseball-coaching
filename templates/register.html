<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アカウント設定 — DIMENSIONING</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0b1930; font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif; }
    .wrap { width: 100%; max-width: 420px; padding: 20px; }
    .brand { text-align: center; margin-bottom: 32px; }
    .brand-icon { width: 52px; height: 52px; background: #1a4a90; border-radius: 10px;
                   display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
    .brand-icon svg { width: 28px; height: 28px; fill: #fff; }
    .brand-name { color: #fff; font-size: .9rem; font-weight: 700; letter-spacing: .25em; }
    .brand-sub  { color: rgba(255,255,255,.3); font-size: .62rem; letter-spacing: .15em; margin-top: 3px; }
    .card { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
             border-radius: 14px; padding: 28px 24px; }
    .welcome { color: rgba(255,255,255,.5); font-size: .7rem; letter-spacing: .12em; margin-bottom: 4px; }
    .player-name { color: #fff; font-size: 1.2rem; font-weight: 800; letter-spacing: .04em; margin-bottom: 20px; }
    .section-label { color: rgba(255,255,255,.35); font-size: .65rem; letter-spacing: .12em;
                      padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,.08);
                      margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    label { color: rgba(255,255,255,.45); font-size: .7rem; letter-spacing: .08em;
             display: block; margin-bottom: 5px; }
    input { width: 100%; background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.12);
             border-radius: 8px; padding: 11px 13px; color: #fff; font-size: .88rem;
             outline: none; transition: .2s; }
    input:focus { border-color: #2563eb; background: rgba(255,255,255,.1); }
    input::placeholder { color: rgba(255,255,255,.2); }
    .hint { font-size: .68rem; color: rgba(255,255,255,.3); margin-top: 4px; }
    .btn { width: 100%; margin-top: 6px; padding: 12px; background: #1a4a90; border: none;
            border-radius: 8px; color: #fff; font-size: .82rem; font-weight: 700;
            letter-spacing: .12em; cursor: pointer; transition: .2s; }
    .btn:hover { background: #2563eb; }
    .alert { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3);
              border-radius: 8px; padding: 10px 13px; color: #fca5a5;
              font-size: .78rem; margin-bottom: 14px; }
    .footer { text-align: center; margin-top: 20px; color: rgba(255,255,255,.15);
               font-size: .62rem; letter-spacing: .08em; }
    .pw-strength { height: 3px; border-radius: 2px; margin-top: 5px;
                    background: rgba(255,255,255,.1); overflow: hidden; }
    .pw-strength-bar { height: 100%; border-radius: 2px; width: 0; transition: .3s; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
    </div>
    <div class="brand-name">DIMENSIONING</div>
    <div class="brand-sub">ATHLETE PLATFORM</div>
  </div>

  <div class="card">
    <div class="welcome">WELCOME</div>
    <div class="player-name">{{ player.name }} さん</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert"><i class="bi bi-exclamation-triangle me-1"></i>{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <div class="section-label">アカウントを設定してください</div>

    <form method="POST">
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" name="email" placeholder="your@email.com" required autofocus>
      </div>
      <div class="form-group">
        <label>パスワード</label>
        <input type="password" name="password" id="pw-input" placeholder="8文字以上" required minlength="8">
        <div class="pw-strength"><div class="pw-strength-bar" id="pw-bar"></div></div>
        <div class="hint">8文字以上、英数字を推奨します</div>
      </div>
      <div class="form-group">
        <label>パスワード（確認）</label>
        <input type="password" name="confirm" placeholder="もう一度入力" required>
      </div>
      <button type="submit" class="btn">アカウントを作成してログイン</button>
    </form>
  </div>
  <div class="footer">この招待リンクはあなた専用です。他の人には共有しないでください。</div>
</div>
<script>
document.getElementById('pw-input').addEventListener('input', function() {
  const v = this.value;
  const bar = document.getElementById('pw-bar');
  let score = 0;
  if (v.length >= 8) score++;
  if (v.length >= 12) score++;
  if (/[A-Z]/.test(v)) score++;
  if (/[0-9]/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  const colors = ['#dc2626','#ea580c','#d97706','#16a34a','#16a34a'];
  bar.style.width = (score * 20) + '%';
  bar.style.background = colors[score - 1] || '#dc2626';
});
</script>
</body>
</html>
